const PDF_WORKER_URL = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

function loadScriptOnce(src, globalVarName) {
  return new Promise((resolve, reject) => {
    if (globalVarName && typeof window !== "undefined" && window[globalVarName]) {
      return resolve();
    }
    const existing = document.querySelector('script[src="' + src + '"]');
    if (existing) {
      if (existing.dataset.loaded === "true" || (globalVarName && window[globalVarName])) {
        return resolve();
      }
      if (document.readyState === "complete" || document.readyState === "interactive") {
        return resolve();
      }
      existing.addEventListener("load", () => {
        existing.dataset.loaded = "true";
        resolve();
      });
      existing.addEventListener("error", () => reject(new Error("Failed to load " + src)));
      setTimeout(resolve, 2000);
      return;
    }
    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.onload = () => {
      script.dataset.loaded = "true";
      resolve();
    };
    script.onerror = () => reject(new Error("Failed to load " + src));
    document.head.appendChild(script);
    setTimeout(resolve, 3500);
  });
}

async function extractPdfText(file) {
  await loadScriptOnce(PDF_JS_URL, "pdfjsLib");
  const pdfjsLib = window.pdfjsLib;
  if (!pdfjsLib) throw new Error("PDF reader unavailable");

  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_URL;
  } catch (e) {}

  const buf = await file.arrayBuffer();

  const parseTask = (async () => {
    const loadingTask = pdfjsLib.getDocument({
      data: new Uint8Array(buf),
      useSystemFonts: true,
      stopAtErrors: false
    });
    const doc = await loadingTask.promise;
    let fullText = "";
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      let lastY = null;
      let pageText = "";
      for (const item of content.items) {
        if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) {
          pageText += "\n";
        } else if (pageText && !pageText.endsWith(" ") && !pageText.endsWith("\n")) {
          pageText += " ";
        }
        pageText += item.str;
        lastY = item.transform[5];
      }
      fullText += pageText.trim() + "\n\n";
    }
    return fullText.trim();
  })();

  const timeoutTask = new Promise((_, reject) =>
    setTimeout(() => reject(new Error("timeout")), 7000)
  );

  return Promise.race([parseTask, timeoutTask]);
}

async function extractDocxText(file) {
  await loadScriptOnce(MAMMOTH_URL, "mammoth");
  const mammoth = window.mammoth;
  if (!mammoth) throw new Error("Mammoth reader unavailable");
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return (result && result.value) || "";
}

const STEPS = ["Resume", "Research", "Best fit", "Proposal"];
const MAX_SKILLS_RESEARCHED = 5;
const MAX_RESUME_CHARS = 75000;
const API_ENDPOINT = String(window.RESUME_GENIUS_CONFIG?.apiEndpoint || "").trim();

// Extract only contact information and evidence used to personalize a proposal.
// Market rates, demand, rankings, and leads must always come from the live API.
function parseResumeBasics(text) {
  const lines = text.split('\n').map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return { contact: {}, bullets: [] };

  let rawName = lines[0].split(/[|•,\t]/)[0].trim();
  if (/@|\d{3}|resume|curriculum|summary|profile/i.test(rawName) || rawName.length > 35) {
    rawName = "Candidate";
  }

  const emailMatch = text.match(/[\w.-]+@[\w.-]+\.[a-zA-Z]{2,}/);
  const email = emailMatch ? emailMatch[0] : "";

  const phoneMatch = text.match(/(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}/);
  const phone = phoneMatch ? phoneMatch[0] : "";

  const locMatch = text.match(/([A-Za-z\s]{3,20}),\s*([A-Z]{2})/);
  const location = locMatch ? `${locMatch[1].trim()}, ${locMatch[2]}` : "";

  const bullets = [];
  lines.forEach((l) => {
    if (/^[-•*–\d\.]+\s*/.test(l)) {
      const cleaned = l.replace(/^[-•*–\d\.]+\s*/, '').trim();
      if (cleaned.length > 20) bullets.push(cleaned);
    }
  });

  return { contact: { name: rawName, email, phone, location }, bullets };
}

async function callClaude(messages, tools, retries = 2) {
  if (!API_ENDPOINT || !/^https:\/\//i.test(API_ENDPOINT)) {
    throw new Error("The live analysis service has not been configured.");
  }
  const body = { messages };
  if (tools) body.tools = tools;
  let lastError;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 45000);
    try {
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal: controller.signal,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = data?.error?.message || data?.error || "The analysis service returned an error.";
        const error = new Error(`${detail} (${res.status})`);
        if ([429, 500, 502, 503, 529].includes(res.status) && attempt < retries) {
          lastError = error;
          await new Promise((resolve) => setTimeout(resolve, 800 * Math.pow(2, attempt)));
          continue;
        }
        throw error;
      }
      const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
      if (!text) throw new Error("The analysis service returned an empty response.");
      return text;
    } catch (error) {
      lastError = error?.name === "AbortError" ? new Error("The analysis request timed out.") : error;
      if (attempt >= retries || error?.name === "AbortError") throw lastError;
    } finally {
      clearTimeout(timer);
    }
  }
  throw lastError;
}

function parseJsonLoose(text) {
  const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
  const isArray = cleaned.trim()[0] === "[";
  const start = cleaned.indexOf(isArray ? "[" : "{");
  const end = isArray ? cleaned.lastIndexOf("]") : cleaned.lastIndexOf("}");
  const slice = start >= 0 && end >= 0 ? cleaned.slice(start, end + 1) : cleaned;
  return JSON.parse(slice);
}

function validateSkills(value) {
  if (!Array.isArray(value)) throw new Error("The service returned an invalid skills response.");
  const skills = value.filter((item) => item && typeof item.name === "string" && typeof item.evidence === "string");
  if (!skills.length) throw new Error("No marketable skills could be identified from this resume.");
  return skills.slice(0, MAX_SKILLS_RESEARCHED);
}

function validateRanking(value, skills) {
  if (!value || !Array.isArray(value.ranked) || !value.ranked.length || !value.top) {
    throw new Error("The service returned an invalid ranking response.");
  }
  const used = new Set();
  const list = value.ranked.map((item) => {
    const match = skills.find((skill) => skill.name.toLowerCase() === String(item?.name || "").toLowerCase());
    if (!match || used.has(match.id)) return null;
    used.add(match.id);
    return { id: match.id, name: match.name, note: String(item.note || "") };
  }).filter(Boolean);
  if (!list.length) throw new Error("The ranking response did not match the extracted skills.");
  return { list, top: value.top };
}

function ResumeGenius() {
  const [step, setStep] = useState(1);
  const [resumeText, setResumeText] = useState("");
  const [fileName, setFileName] = useState("");
  const [fileLoading, setFileLoading] = useState(false);
  const fileInputRef = useRef(null);

  const [analyzing, setAnalyzing] = useState(false);
  const [analyzePhase, setAnalyzePhase] = useState("");
  const [researchProgress, setResearchProgress] = useState({ current: 0, total: 0, label: "" });
  const [analyzeError, setAnalyzeError] = useState("");

  const [skills, setSkills] = useState([]);
  const [research, setResearch] = useState({});
  const [ranking, setRanking] = useState(null);
  const [leads, setLeads] = useState([]);
  const [leadsNote, setLeadsNote] = useState("");
  const [selectedLeadId, setSelectedLeadId] = useState(null);
  const [contactInfo, setContactInfo] = useState({ name: "", email: "", phone: "", location: "" });
  const [parsedBullets, setParsedBullets] = useState([]);

  const [loadingProposal, setLoadingProposal] = useState(false);
  const [proposalError, setProposalError] = useState("");
  const [proposal, setProposal] = useState("");
  const [copied, setCopied] = useState(false);
  const [consent, setConsent] = useState(false);

  function resetAll() {
    setStep(1);
    setResumeText("");
    setFileName("");
    setSkills([]);
    setResearch({});
    setRanking(null);
    setLeads([]);
    setLeadsNote("");
    setSelectedLeadId(null);
    setContactInfo({ name: "", email: "", phone: "", location: "" });
    setParsedBullets([]);
    setProposal("");
    setAnalyzeError("");
    setProposalError("");
    setConsent(false);
  }

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    setAnalyzeError("");
    setFileLoading(true);
    const name = file.name.toLowerCase();
    try {
      if (file.size > 10 * 1024 * 1024) throw new Error("file-too-large");
      if (name.endsWith(".pdf")) {
        const text = await extractPdfText(file);
        if (!text) throw new Error("empty");
        setResumeText(text);
      } else if (name.endsWith(".docx")) {
        const text = await extractDocxText(file);
        if (!text) throw new Error("empty");
        setResumeText(text);
      } else if (name.endsWith(".doc")) {
        throw new Error("legacy-doc");
      } else {
        const text = await file.text();
        if (!text.trim()) throw new Error("empty");
        setResumeText(text);
      }
    } catch (err) {
      if (err && err.message === "file-too-large") {
        setAnalyzeError("That file is larger than 10 MB. Upload a smaller file or paste the resume text.");
      } else if (err && err.message === "legacy-doc") {
        setAnalyzeError("Old .doc files can't be read in-browser. Save it as .docx or .pdf, or paste the text directly.");
      } else if (err && err.message === "timeout") {
        setAnalyzeError("File reading timed out. You can paste the resume text directly into the box below.");
      } else {
        setAnalyzeError("Couldn't read that file. Try pasting the resume text directly into the box below.");
      }
    } finally {
      setFileLoading(false);
      if (e.target) e.target.value = "";
    }
  }

  async function analyzeResume() {
    setAnalyzeError("");
    setAnalyzing(true);
    setAnalyzePhase("extracting");

    try {
        if (resumeText.length > MAX_RESUME_CHARS) {
          throw new Error("This resume is too long. Keep it under 75,000 characters.");
        }
        const basics = parseResumeBasics(resumeText);
        setContactInfo(basics.contact);
        setParsedBullets(basics.bullets);
        const extractPrompt =
          "Read this resume and identify up to " + MAX_SKILLS_RESEARCHED + " marketable skills this person could sell as a freelancer, " +
          "consultant, or contractor. For each, give a short, client-facing skill name (not a resume buzzword), one sentence of evidence " +
          'pulled from the resume, and a category. Return ONLY a JSON array, no other text, in this exact shape: ' +
          '[{"name": "...", "evidence": "...", "category": "..."}]\n\nRESUME:\n' + resumeText;
        const extractText = await callClaude([{ role: "user", content: extractPrompt }]);
        const parsedSkills = validateSkills(parseJsonLoose(extractText));
        const withIds = parsedSkills.map((s, i) => ({ id: "s" + i, name: s.name.trim(), evidence: s.evidence.trim(), category: String(s.category || "Other") }));
        setSkills(withIds);

        setAnalyzePhase("researching");
        const results = {};
        for (let i = 0; i < withIds.length; i++) {
          const s = withIds[i];
          setResearchProgress({ current: i + 1, total: withIds.length, label: s.name });
          const researchPrompt =
            "Research the current market for freelancers and small businesses looking to hire for this skill: \"" +
            s.name + "\". Report in under 150 words: (1) types of businesses hiring for this right now, " +
            "(2) freelance/project rate range in USD, (3) full-time salary range in USD, " +
            "(4) demand trend right now. Be specific with numbers.";
          const text = await callClaude(
            [{ role: "user", content: researchPrompt }],
            [{ type: "web_search_20250305", name: "web_search", max_uses: 3 }]
          );
          results[s.id] = text || "Market analysis completed.";
        }
        setResearch(results);

        setAnalyzePhase("ranking");
        const bundle = withIds
          .map((s) => "SKILL: " + s.name + "\nEvidence: " + s.evidence + "\nMarket research: " + (results[s.id] || ""))
          .join("\n\n");
        const rankPrompt =
          "Rank these skills from most to least valuable for immediate income potential and packaging simplicity. " +
          "Return ONLY JSON: {\"ranked\": [{\"name\": \"...\", \"note\": \"...\"}], \"top\": {\"rate\": \"...\", \"demand\": \"...\", \"why\": \"...\", \"steps\": [\"...\"]}}\n\n" + bundle;
        const rankText = await callClaude([{ role: "user", content: rankPrompt }]);
        const validatedRanking = validateRanking(parseJsonLoose(rankText), withIds);
        const rankedList = validatedRanking.list;
        setRanking(validatedRanking);

        setAnalyzePhase("leads");
        const topSkillName = rankedList[0].name;
        const leadsPrompt =
          "Use web search to find up to 4 real, currently active businesses or organizations with evidence that they need freelance or contract help with \"" + topSkillName + "\". " +
          "Do not invent names. Return fewer or an empty array when evidence is insufficient. " +
          "Return ONLY JSON: [{\"name\": \"...\", \"info\": \"...\", \"source\": \"a direct public URL\"}]";
        const leadsText = await callClaude(
          [{ role: "user", content: leadsPrompt }],
          [{ type: "web_search_20250305", name: "web_search", max_uses: 4 }]
        );
        const parsedLeads = parseJsonLoose(leadsText);
        const leadsWithIds = (Array.isArray(parsedLeads) ? parsedLeads : [])
          .filter((lead) => lead && typeof lead.name === "string" && /^https:\/\//i.test(String(lead.source || "")))
          .slice(0, 4)
          .map((lead, i) => ({ id: "l" + i, name: lead.name, info: String(lead.info || ""), source: lead.source }));
        setLeads(leadsWithIds);
        setLeadsNote(leadsWithIds.length ? "Verify each opportunity at its linked source before contacting the organization." : "No verifiable active opportunities were found in this search.");
        setStep(3);
    } catch (err) {
      const reason = err?.message || "Unknown error.";
      setAnalyzeError("Analysis could not be completed: " + reason + " Please try again.");
    } finally {
      setAnalyzing(false);
      setAnalyzePhase("");
    }
  }

  async function generateProposal() {
    setProposalError("");
    setLoadingProposal(true);
    try {
      const top = ranking.list[0];
      const skill = skills.find((s) => s.id === top.id) || skills[0];
      const selectedLead = leads.find((l) => l.id === selectedLeadId);

      const targetClient = selectedLead ? selectedLead.name : "Prospective Client";
      const targetNeed = selectedLead ? selectedLead.info : "optimizing core workflows and managing operational systems";

      const candName = (contactInfo && contactInfo.name && contactInfo.name !== "Candidate") ? contactInfo.name : "Consultant";
      const candEmail = (contactInfo && contactInfo.email) ? contactInfo.email : "[Your Email]";
      const candPhone = (contactInfo && contactInfo.phone) ? contactInfo.phone : "[Your Phone]";
      const candLoc = (contactInfo && contactInfo.location) ? contactInfo.location : "[Your Location]";
      const candTitle = skill.name ? `${skill.name} Specialist` : "Operations & Technical Specialist";

      const bullet1 = (parsedBullets && parsedBullets[0]) ? parsedBullets[0] : `Direct execution and oversight of ${skill.name}.`;
      const bullet2 = parsedBullets?.[1] || "Standardization of procedures to eliminate recurring bottlenecks.";
      const bullet3 = parsedBullets?.[2] || "Proactive resolution of urgent operational escalations.";

      const propText =
`PROPOSAL: FRACTIONAL SUPPORT & WORKFLOW STABILIZATION
Prepared for: Leadership Team, ${targetClient}
Prepared by:  ${candName} | ${candTitle}
Direct:       ${candPhone} | ${candEmail} | ${candLoc}

----------------------------------------------------------------------
1. EXECUTIVE SUMMARY & SITUATION OVERVIEW
Growing organizations frequently encounter operational drag: unorganized workflows, backlogged support requests, and recurring technical friction that pulls internal teams away from core business objectives.

Targeted Objective: ${targetNeed}

This proposal outlines a structured, SLA-backed support engagement designed to eliminate workflow downtime, resolve backlogs quickly, and institutionalize standard operating procedures.

Demonstrated Qualifications:
• Proven background delivering: "${skill.evidence}"
• Hands-on proficiency across core competencies: ${skills.map((s) => s.name).join(", ")}.

----------------------------------------------------------------------
2. SCOPE OF SERVICES & TECHNICAL DELIVERABLES
• Priority Workflow Execution:
  - Rapid intake, triage, and resolution of support requests and operational blockers.
  - Dedicated support for team members and systems administration.

• Core Competency Oversight (${skill.name}):
  - ${bullet1}
  - ${bullet2}

• Standardization & Documentation:
  - Standard Operating Procedure (SOP) documentation for incident escalation and daily operations.
  - ${bullet3}

----------------------------------------------------------------------
3. SERVICE LEVEL AGREEMENTS (SLAs)
• Severity 1 (Critical Outage / Blocker): < 30 minutes initial response & mitigation.
• Severity 2 (Operational Friction): < 2 hours resolution target.
• General Inquiries & Standard Tasks: Same-business-day turnaround.
• Bi-Weekly Systems Report: Summary of completed items, root-cause resolutions, and efficiency recommendations.

----------------------------------------------------------------------
4. ENGAGEMENT & INVESTMENT OPTIONS
• Option A: Dedicated Fractional Retainer — $2,850 / month
  Up to 20 dedicated hours monthly, priority SLA response, and ongoing systems maintenance. (Month-to-month, 30 days' notice).

• Option B: 2-Week Stabilization Sprint — $1,950 (One-Time)
  Focused audit of current workflow backlogs, SOP creation, and process cleanup.

• Option C: Flexible Project / Ad-Hoc Support — $75 / hour
  On-demand coverage for systems transitions, surge volume, or specialized initiatives.

----------------------------------------------------------------------
5. NEXT STEPS & IMPLEMENTATION
To review your current environment and confirm alignment:
1. Schedule a brief 15-minute operational discovery call this week.
2. Confirm priority bottlenecks and preferred start date.

Available times: Thursday or Friday between 10:00 AM – 3:00 PM.
Direct confirmation: ${candEmail} | ${candPhone}`;

      setProposal(propText);
      setStep(4);
    } catch (err) {
      setProposalError("Couldn't draft the proposal just now. Try again.");
    } finally {
      setLoadingProposal(false);
    }
  }

  function copyProposal() {
    navigator.clipboard.writeText(proposal).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  function analyzeLoadingText() {
    if (analyzePhase === "extracting") return "Reading the resume and identifying marketable skills...";
    if (analyzePhase === "researching") {
      return "Researching " + researchProgress.label + " (" + researchProgress.current + " of " + researchProgress.total + ")...";
    }
    if (analyzePhase === "ranking") return "Comparing skills for income potential...";
    if (analyzePhase === "leads") return "Finding businesses that need this skill right now...";
    return "Working...";
  }

  return (
    <div className="sct">
      <style>{CSS}</style>
      <div className="sct-wrap">
        <div className="sct-head">
          <h1>Resume Genius</h1>
          <p>Upload a resume. It finds the sellable skills, researches what entrepreneurs and businesses are actually paying for each one right now, highlights the strongest bet, and drafts the proposal to go land the first client.</p>
        </div>

        <div className="sct-rail" aria-label="Analysis progress">
          {STEPS.map((label, i) => {
            const n = i + 1;
            const state = n < step ? "done" : n === step ? "active" : "";
            return (
              <div className="sct-step" key={label} style={{ flex: n === STEPS.length ? "0 0 auto" : 1 }}>
                <div className={"sct-dot " + state} aria-current={n === step ? "step" : undefined}>{n < step ? "\u2713" : n}</div>
                <div className="sct-label">{label}</div>
                {n !== STEPS.length && <div className={"sct-connector " + (n < step ? "done" : "")} />}
              </div>
            );
          })}
        </div>

        {step === 1 && (
          <div className="sct-card">
            <h2>Start with a resume</h2>
            <p className="sct-sub">Paste the text below, or upload a .pdf, .docx, or .txt file.</p>
            {analyzeError && <div className="sct-err" role="alert">{analyzeError}</div>}
            <label htmlFor="resume-text" className="sct-stepslabel">Resume text</label>
            <textarea
              id="resume-text"
              className="sct-textarea"
              placeholder="Paste resume text here..."
              value={resumeText}
              onChange={(e) => setResumeText(e.target.value)}
            />
            <div className="sct-filerow">
              <input ref={fileInputRef} type="file" accept=".txt,.docx,.pdf" onChange={handleFile} />
              {fileLoading && <span className="sct-loading"><span className="sct-spin" />Reading {fileName}...</span>}
              {!fileLoading && fileName && resumeText && <span>{fileName} loaded</span>}
            </div>
            <label className="sct-consent">
              <input type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)} />
              <span>I consent to sending this resume to the AI analysis service and confirm I have permission to process its contents. See the <a href="./privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.</span>
            </label>
            <div style={{ marginTop: 16 }}>
              {analyzing ? (
                <div className="sct-loading" role="status" aria-live="polite"><div className="sct-spin" />{analyzeLoadingText()}</div>
              ) : (
                <button className="sct-btn" disabled={!resumeText.trim() || fileLoading || !consent} onClick={analyzeResume}>
                  Find my most valuable skill
                </button>
              )}
            </div>
          </div>
        )}

        {step === 3 && ranking && (
          <div className="sct-card">
            <div className="sct-pick">
              <div className="sct-eyebrow">Best opportunity to lead with</div>
              <h2>{ranking.list[0].name}</h2>
              {ranking.top && (
                <div className="sct-statrow">
                  {ranking.top.rate && <div className="sct-stat"><span className="sct-statlabel">Typical rate</span>{ranking.top.rate}</div>}
                  {ranking.top.demand && <div className="sct-stat"><span className="sct-statlabel">Demand</span>{ranking.top.demand}</div>}
                </div>
              )}
              {ranking.top && ranking.top.why && <p className="sct-why">{ranking.top.why}</p>}
              {ranking.top && Array.isArray(ranking.top.steps) && ranking.top.steps.length > 0 && (
                <div className="sct-steps">
                  <div className="sct-stepslabel">Get started this week</div>
                  <ol>
                    {ranking.top.steps.map((s, i) => (
                      <li key={i}>{s}</li>
                    ))}
                  </ol>
                </div>
              )}
            </div>
            <h2 style={{ fontSize: 15, marginBottom: 10 }}>Full skill value ranking</h2>
            <div className="sct-ranklist">
              {ranking.list.map((r, i) => (
                <div className="sct-rankrow" key={r.id}>
                  <div className="sct-ranknum">{i + 1}</div>
                  <div>
                    <div className="sct-rankname">{r.name}</div>
                    <div className="sct-ranknote">{r.note}</div>
                  </div>
                </div>
              ))}
            </div>

            <h2 style={{ fontSize: 15, margin: "22px 0 6px" }}>Businesses that could use this right now</h2>
            <p className="sct-sub" style={{ marginBottom: 12 }}>
              Found through live search around "{ranking.list[0].name}." Pick one to write the proposal directly to them, or skip to keep it general.
            </p>
            {leadsNote && <div className="sct-hint" style={{ marginBottom: 10 }}>{leadsNote}</div>}
            {leads.length > 0 && (
              <div style={{ marginBottom: 6 }}>
                <label className={"sct-lead " + (selectedLeadId === null ? "selected" : "")}>
                  <input type="radio" name="lead" checked={selectedLeadId === null} onChange={() => setSelectedLeadId(null)} />
                  <div>
                    <div className="sct-leadname">Keep it general</div>
                    <div className="sct-leadinfo">Write a template proposal not tied to one specific company.</div>
                  </div>
                </label>
                {leads.map((l) => (
                  <label key={l.id} className={"sct-lead " + (selectedLeadId === l.id ? "selected" : "")}>
                    <input type="radio" name="lead" checked={selectedLeadId === l.id} onChange={() => setSelectedLeadId(l.id)} />
                    <div>
                      <div className="sct-leadname">{l.name}</div>
                      <div className="sct-leadinfo">{l.info}</div>
                      {l.source && <div className="sct-leadsource">Source: <a href={l.source} target="_blank" rel="noopener noreferrer">View evidence</a></div>}
                    </div>
                  </label>
                ))}
              </div>
            )}

            {proposalError && <div className="sct-err" role="alert" style={{ marginTop: 16 }}>{proposalError}</div>}
            <div style={{ marginTop: 18 }}>
              {loadingProposal ? (
                <div className="sct-loading"><div className="sct-spin" />Drafting the proposal...</div>
              ) : (
                <button className="sct-btn" onClick={generateProposal}>Draft the proposal</button>
              )}
            </div>
          </div>
        )}

        {step === 4 && (
          <div className="sct-card">
            <h2>Proposal draft</h2>
            <p className="sct-sub">
              Built around {ranking && ranking.list[0].name}
              {(() => {
                const lead = leads.find((l) => l.id === selectedLeadId);
                return lead ? ", addressed to " + lead.name + "." : ", written as a general template.";
              })()}
              {" "}Edit freely before sending.
            </p>
            <textarea className="sct-proposal" value={proposal} onChange={(e) => setProposal(e.target.value)} aria-label="Editable proposal draft" style={{ width: "100%", minHeight: 520, resize: "vertical" }} />
            <div className="sct-actions">
              <button className="sct-btn" onClick={copyProposal}>Copy proposal</button>
              {copied && <span className="sct-copied">Copied</span>}
              <button className="sct-btn secondary" onClick={resetAll}>Start a new resume</button>
            </div>
          </div>
        )}
        <footer className="sct-footer">
          Resume Genius provides AI-assisted guidance, not guaranteed employment or income results.<br />
          <a href="./privacy.html">Privacy Policy</a> · <a href="./terms.html">Terms of Use</a>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ResumeGenius />);
  </script>
</body>
</html>
